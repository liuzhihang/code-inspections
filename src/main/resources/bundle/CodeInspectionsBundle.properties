# Concurrency
ali.p3c.concurrent.ThreadLocalShouldRemoveInspectionTool.key=Customized ThreadLocal variables must be recycled.
ali.p3c.concurrent.ThreadLocalShouldRemoveInspectionTool.message=Field [%s] of type 'ThreadLocal' must call remove() method at least one times.
ali.p3c.concurrent.ThreadShouldSetNameInspectionTool.key=When creating threads or thread pools, please specify meaningful thread names to facilitate error tracing.
ali.p3c.concurrent.ThreadShouldSetNameInspectionTool.message.ThreadPoolExecutor=Use ThreadPoolExecutor's constructor with parameter of type ThreadFactory to set a thread name.
ali.p3c.concurrent.ThreadShouldSetNameInspectionTool.message.ScheduledThreadPoolExecutor=Use ScheduledThreadPoolExecutor's constructor with parameter of type ThreadFactory to set a thread name.
ali.p3c.concurrent.AvoidManuallyCreateThreadInspectionTool.key=Threads should be provided by thread pools. Explicitly creating threads is not allowed.
ali.p3c.concurrent.AvoidManuallyCreateThreadInspectionTool.message=Explicitly creating threads is not allowed, use thread pool instead.
ali.p3c.concurrent.ThreadPoolCreationInspectionTool.key=The thread pool should not be created using Executors, but rather through the ThreadPoolExecutor method.
ali.p3c.concurrent.ThreadPoolCreationInspectionTool.message=Manually create thread pool is better.
ali.p3c.concurrent.AvoidCallStaticSimpleDateFormatInspectionTool.key=SimpleDataFormat is unsafe, do not define it as a static variable. If have to, lock or DateUtils class must be used.
ali.p3c.concurrent.AvoidCallStaticSimpleDateFormatInspectionTool.message=[%s()] may cause thread-safety issues.
