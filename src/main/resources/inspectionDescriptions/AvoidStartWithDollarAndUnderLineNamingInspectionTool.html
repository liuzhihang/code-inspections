<html lang="en">
<head>
    <title>AvoidStartWithDollarAndUnderLineNamingInspectionTool</title>
    <meta charset="UTF-8"/>
</head>
<body>
<b style="color: #D56561;">【强制】</b> 代码中的命名均不能以下划线或美元符号开始，也不能以下划线或美元符号结束。

<br>
<span style="color: #E1736F;">&nbsp;&nbsp;反例：</span>
<pre><code>
    public class _Demo {
        private String _name;
    }
</code></pre>

<span style="color: #6AAB71;">&nbsp;&nbsp;正例：</span>
<pre><code>
    public class Demo {
        private String name;
    }
</code></pre>
</body>
</html>
