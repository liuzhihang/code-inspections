<html lang="en">
<head>
    <title>AvoidManuallyCreateThreadInspectionTool</title>
    <meta charset="UTF-8"/>
</head>
<body>
<b style="color: #D56561;">【强制】</b>线程资源必须通过线程池提供，不允许在应用中自行显式创建线程。
<br>
<span style="color: #F6CF6E;">&nbsp;&nbsp;说明：</span>线程池的好处是减少在创建和销毁线程上所消耗的时间以及系统资源的开销，解决资源不足的问题。
如果不使用线程池，有可能造成系统创建大量同类线程而导致消耗完内存或者“过度切换”的问题。
</body>
</html>
