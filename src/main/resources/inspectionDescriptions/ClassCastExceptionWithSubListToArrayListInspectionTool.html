<body>
<!-- 【强制】ArrayList 的 subList 结果不可强转成 ArrayList，否则会抛出 ClassCastException 异常：
java.util.RandomAccessSubList cannot be cast to java.util.ArrayList。
说明：subList() 返回的是 ArrayList 的内部类 SubList，并不是 ArrayList 本身，而是 ArrayList 的一个视图，对于
SubList 的所有操作最终会反映到原列表上。 -->
<b style="color: #D56561;">【强制】</b>ArrayList 的 subList 结果不可强转成 ArrayList，否则会抛出 ClassCastException 异常：
java.util.RandomAccessSubList cannot be cast to java.util.ArrayList。
<br>
<span style="color: #F6CF6E;">&nbsp;&nbsp;说明：</span>subList() 返回的是 ArrayList 的内部类 SubList，并不是 ArrayList 本身，而是 ArrayList
的一个视图，对于
SubList 的所有操作最终会反映到原列表上。
</body>
